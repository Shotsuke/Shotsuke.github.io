name: Update presence
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  repository_dispatch:
    types: [computer-presence]
  workflow_dispatch:
    inputs:
      activity:
        description: 'Manual status (keep leaves existing override unchanged)'
        type: choice
        options: [keep, auto, working, gaming, browsing, using, away, sleeping]
        default: keep
      minutes:
        description: 'Manual status lifetime in minutes (1–720)'
        default: '60'
permissions:
  contents: write
concurrency:
  group: presence-${{ github.event.client_payload.device || 'health' }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install health reader
        run: pip install -r tools/presence/requirements.txt --quiet
      - name: Update public snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MI_USER_ID: ${{ secrets.MI_USER_ID }}
          MI_PASS_TOKEN: ${{ secrets.MI_PASS_TOKEN }}
        run: python tools/presence/publish.py
